name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  smoke-validation:
    name: Compose + PHP smoke validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate Docker Compose syntax
        run: docker compose config >/dev/null

      - name: Lint PHP sources
        run: |
          find app/src -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            php -l "$file"
          done

  secret-scan:
    name: Secret & Credential Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST Code Analysis (Semgrep OSS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Semgrep security scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep \
            semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/php" \
            --error \
            /src || true

  container-security:
    name: Container Image & Misconfiguration Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Trivy config scan on repo
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  sigma-validation:
    name: Sigma Detection Rule Quality & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pySigma Validator
        run: |
          python -m pip install --upgrade pip
          pip install sigma-cli pySigma

      - name: Validate Detection Engineering Rules
        run: |
          echo "[*] Checking Sigma rule syntax in telemetry/rules/sigma/..."
          for rule in telemetry/rules/sigma/*.yml; do
            echo "Linting: $rule"
            sigma check "$rule" || exit 1
          done
          echo "[✓] All detection rules passed Sigma validation standards."
