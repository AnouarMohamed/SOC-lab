name: DevSecOps Automated CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. SECRET SCANNING (Shift-Left Credential Protection)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret & Credential Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # 2. STATIC APPLICATION SECURITY TESTING (SAST - Semgrep OSS)
  # ---------------------------------------------------------------------------
  sast-scan:
    name: SAST Code Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Execute Semgrep Security Rulesets
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep \
            semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/php" \
            --error \
            /src || true

  # ---------------------------------------------------------------------------
  # 3. CONTAINER IMAGE & MISCONFIGURATION SCAN (Trivy)
  # ---------------------------------------------------------------------------
  container-security:
    name: Container Security & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner on Hardened Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ---------------------------------------------------------------------------
  # 4. INFRASTRUCTURE-AS-CODE (IaC) SCANNING (Checkov)
  # ---------------------------------------------------------------------------
  iac-security:
    name: Infrastructure as Code (IaC) Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov on Docker Compose and Dockerfiles
        run: |
          checkov -d . --framework dockerfile,yaml --compact --soft-fail

  # ---------------------------------------------------------------------------
  # 5. DETECTION-AS-CODE LINTING (Sigma Rules Validation)
  # ---------------------------------------------------------------------------
  sigma-validation:
    name: Sigma Detection Rule Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pySigma Validator
        run: |
          python -m pip install --upgrade pip
          pip install sigma-cli pySigma

      - name: Validate Detection Engineering Rules
        run: |
          echo "Validating Sigma rules in telemetry/rules/sigma/..."
          for rule in telemetry/rules/sigma/*.yml; do
            echo "Checking: $rule"
            sigma check "$rule" || exit 1
          done
          echo "All detection rules passed Sigma validation standards."
