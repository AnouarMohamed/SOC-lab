title: Mass Database Extraction Query via Web Application Context
id: ae40a415-0007-4f04-c237-63de9e481007
status: test
description: Detects abnormal database extraction queries requesting large customer record sets without paging, typical of data exfiltration in SQL injections or webshell data dumping.
references:
    - https://attack.mitre.org/techniques/T1567/
author: Atlas SecOps Detection Engineering
date: 2026-10-01
tags:
    - attack.exfiltration
    - attack.t1567
logsource:
    service: postgresql
    product: linux
detection:
    selection_keywords:
        message|contains:
            - 'SELECT customer_uuid, full_name, email'
            - 'SELECT * FROM crm.customers'
            - 'pg_dump'
            - 'customers LIMIT 40000'
    condition: selection_keywords
falsepositives:
    - Nightly automated backup script running from approved host.
level: high
