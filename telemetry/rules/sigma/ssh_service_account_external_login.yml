title: Service Account SSH Login from Non-Standard Source IP
id: 6a06d071-bb63-4bd0-c8f3-2f9b5a04f003
status: test
description: Detects successful SSH logins using internal automation service accounts (e.g. svc-backup) originating from external or non-management subnets.
references:
    - https://attack.mitre.org/techniques/T1021/004/
    - https://attack.mitre.org/techniques/T1078/002/
author: Atlas SecOps DFIR Team
date: 2026-10-01
tags:
    - attack.initial_access
    - attack.t1078.002
    - attack.lateral_movement
    - attack.t1021.004
logsource:
    product: linux
    service: sshd
detection:
    selection_auth:
        message|contains:
            - 'Accepted password for'
            - 'Accepted publickey for'
    selection_user:
        message|contains:
            - 'for svc-backup'
            - 'for svc-deploy'
            - 'for backup-runner'
    filter_trusted_bastion:
        message|contains:
            - 'from 10.0.0.5'     # Approved management bastion
            - 'from 172.28.30.30' # Approved NAS-BKP
    condition: selection_auth and selection_user and not filter_trusted_bastion
falsepositives:
    - Re-architected backup automation topology without prior change ticket.
level: critical
