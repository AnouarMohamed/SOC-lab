title: Web Shell File Creation in Web Upload Directory
id: 59f5c960-aa52-4ac9-b7e2-1f8a4f93e002
status: test
description: Detects the creation of executable script files (.php, .phtml, .sh, .py) within directories designated for media or document uploads.
references:
    - https://attack.mitre.org/techniques/T1505/003/
author: Atlas SecOps DFIR Team
date: 2026-10-01
tags:
    - attack.persistence
    - attack.t1505.003
logsource:
    category: file_event
    product: linux
detection:
    selection_target_path:
        TargetFilename|contains:
            - '/uploads/'
            - '/media/'
            - '/documents/'
            - '/static/files/'
    selection_extension:
        TargetFilename|endswith:
            - '.php'
            - '.php3'
            - '.php4'
            - '.php5'
            - '.phtml'
            - '.phar'
            - '.sh'
            - '.py'
            - '.pl'
    condition: selection_target_path and selection_extension
falsepositives:
    - Misconfigured administrative deployment plugins.
level: critical
