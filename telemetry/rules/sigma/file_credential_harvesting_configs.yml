title: Sensitive Configuration or Script File Access by Web User
id: 9d39f304-ff96-4ef3-b126-52cd8d370006
status: test
description: Detects web application workers accessing configuration files, shell scripts in /opt, or SSH key directories containing stored credentials.
references:
    - https://attack.mitre.org/techniques/T1552/001/
author: Atlas SecOps Detection Engineering
date: 2026-10-01
tags:
    - attack.credential_access
    - attack.t1552.001
logsource:
    category: file_access
    product: linux
detection:
    selection_user:
        User:
            - 'www-data'
            - 'apache'
    selection_targets:
        TargetFilename|contains:
            - '/opt/scripts/'
            - '/.ssh/'
            - '/etc/shadow'
            - 'db.php'
            - 'config.php'
            - '.env'
    condition: selection_user and selection_targets
falsepositives:
    - Normal application reads of db.php during bootstrap (tune with command-line parent filters).
level: medium
