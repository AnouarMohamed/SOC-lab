title: System and User Discovery Commands Spawned by Web Service
id: 8c28f293-ee85-4df2-a015-41bc7c26f005
status: test
description: Detects the execution of discovery and reconnaissance commands (id, whoami, uname, hostname, ip) initiated by web service accounts such as www-data or apache.
references:
    - https://attack.mitre.org/techniques/T1082/
    - https://attack.mitre.org/techniques/T1033/
author: Atlas SecOps Detection Engineering
date: 2026-10-01
tags:
    - attack.discovery
    - attack.t1082
    - attack.t1033
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        ParentUser:
            - 'www-data'
            - 'apache'
            - 'nginx'
    selection_commands:
        Image|endswith:
            - '/id'
            - '/whoami'
            - '/uname'
            - '/hostname'
            - '/ifconfig'
            - '/ip'
    condition: selection_parent and selection_commands
falsepositives:
    - Custom web-based system administrative management scripts.
level: high
