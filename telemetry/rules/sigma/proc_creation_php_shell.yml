title: Suspicious Process Spawning from Web Server (PHP/Apache)
id: 48e4b859-9941-49b8-a6d1-0f7f3e82d001
status: test
description: Detects interactive shells or command execution utilities spawned by web server processes (Apache / PHP-FPM), characteristic of web shell execution or remote code execution.
references:
    - https://attack.mitre.org/techniques/T1059/004/
    - https://attack.mitre.org/techniques/T1505/003/
author: Anouar Mohamed, Zakaria Bouzouba (Atlas SecOps Team)
date: 2026-10-01
modified: 2026-10-01
tags:
    - attack.execution
    - attack.t1059.004
    - attack.persistence
    - attack.t1505.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        ParentImage|endswith:
            - '/apache2'
            - '/httpd'
            - '/php'
            - '/php-fpm'
    selection_child:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
            - '/zsh'
            - '/python'
            - '/python3'
            - '/perl'
            - '/nc'
            - '/netcat'
            - '/curl'
            - '/wget'
    condition: selection_parent and selection_child
falsepositives:
    - Legitimate administrative maintenance scripts initiated via custom web administration tools (rare).
level: high
