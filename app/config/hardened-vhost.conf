<VirtualHost *:80>
    ServerAdmin security@atlas-distribution.local
    DocumentRoot /var/www/html

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net;"

    <Directory /var/www/html>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # REMEDIATION: Strict hardening of uploads directory
    # 1. Disable PHP script engine entirely
    # 2. Disable execution of CGI / scripts
    # 3. Restrict MIME interpretation
    <Directory /var/www/html/uploads>
        php_admin_flag engine off
        Options -Indexes -ExecCGI
        AllowOverride None
        
        <FilesMatch "(?i)\.(php|phtml|phar|sh|pl|py|cgi)$">
            Order Deny,Allow
            Deny from all
        </FilesMatch>
        
        Require all granted
    </Directory>

    LogLevel notice
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
