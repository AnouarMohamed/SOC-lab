<VirtualHost *:80>
    ServerAdmin webmaster@atlas-distribution.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Lab vulnerability note: The upload directory has PHP execution enabled in the unhardened baseline
    <Directory /var/www/html/uploads>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    LogLevel warn
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
